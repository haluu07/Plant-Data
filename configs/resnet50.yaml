model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 17
  dropout: 0.3

data:
  image_size: [224, 224]
  train_batch_size: 32
  val_batch_size: 32
  num_workers: 4
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  epochs: 30
  optimizer: "sgd"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: "cosine"
  label_smoothing: 0.1
  early_stopping_patience: 6

augmentation:
  random_crop: true
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 30
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
  random_erasing: 0.25
  cutmix_prob: 0.3
