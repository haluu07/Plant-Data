model:
  architecture: "mobilenet_v2"
  pretrained: true
  num_classes: 17
  dropout: 0.2

data:
  image_size: [224, 224]
  train_batch_size: 64
  val_batch_size: 64
  num_workers: 4
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  epochs: 25
  optimizer: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: "cosine"
  label_smoothing: 0.1
  early_stopping_patience: 5

augmentation:
  random_crop: true
  horizontal_flip: true
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  random_erasing: 0.2
